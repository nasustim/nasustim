name: Update README.md
on:
  schedule:
    - cron: "0 15 * * *" # JST 0AM
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/update-readme.yml

jobs:
  update_readmemd:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - run: go install github.com/nasustim/ghsummarygen@latest

      - name: Make summary
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ghsummarygen --user_name nasustim --access_token $GITHUB_TOKEN --out ./github-stat.svg

          if [ ! -e ./images ]; then
            mkdir images
          fi
          mv ./github-stat.svg ./images/

      - name: Generate README.md
        run: go run cmd/cli/main.go

      - name: Push to main
        if: github.event_name != 'pull_request'
        run: |
          # diffがない場合はskip
          has_diff=$(git status | grep 'Changes not staged for commit' || true)
          if [ -z "${has_diff}" ]; then
            exit 0
          fi

          git config user.name "nasustim-s-magical-automation[bot]"
          git config user.email "3906390+nasustim-s-magical-automation[bot]@users.noreply.github.com"
          git add .
          git commit -m "[auto commit] update README.md"
          git push origin main
